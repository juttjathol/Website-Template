name = "fashion-api"
main = "backend/worker.js"
compatibility_date = "2024-09-22"
compatibility_flags = ["nodejs_compat"]

# Cloudflare KV namespace binding (create with: wrangler kv:namespace create FASHION_KV)
kv_namespaces = [
  { binding = "FASHION_KV", id = "your_kv_namespace_id" }
]

[vars]
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "luxury2024!"
SENDGRID_FROM = "orders@luxuryfashion.com"
ADMIN_EMAIL = "admin@example.com"

# Secret environment variables — set these in your Cloudflare dashboard or with:
# wrangler secret put SENDGRID_API_KEY
# wrangler secret put CLOUDINARY_CLOUD_NAME
# wrangler secret put CLOUDINARY_API_KEY
# wrangler secret put CLOUDINARY_API_SECRET
